<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a2a3a, #0d1420);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e8eef5;
  }
  .container {
    text-align: center;
    padding: 24px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
  }
  h1 {
    font-size: 28px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 4px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    margin: 0 auto 12px;
    font-size: 16px;
  }
  .hud span b { color: #4ade80; font-size: 20px; }
  #board {
    background: #0f1b2b;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.08);
    display: block;
    margin: 0 auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 15, 25, 0.82);
    border-radius: 10px;
    gap: 14px;
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 26px; color: #4ade80; }
  .overlay p { font-size: 14px; color: #9fb3c8; line-height: 1.8; }
  .board-wrap { position: relative; width: 480px; margin: 0 auto; }
  button {
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #0d1420;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    font-weight: bold;
    transition: transform .15s;
  }
  button:hover { transform: scale(1.05); }
  .tips {
    margin-top: 14px;
    font-size: 13px;
    color: #7a8ea3;
  }
  .tips kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: inherit;
    margin: 0 2px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>贪 吃 蛇</h1>
  <div class="hud">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="best">0</b></span>
    <span>速度：<b id="speed">1</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">准备开始</h2>
      <p id="overlayText">吃掉食物成长，撞墙或撞到自己即结束</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="tips">
    操作：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
    ｜ 空格暂停
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const GRID = 24;               // 网格数
const CELL = canvas.width / GRID; // 单元格大小 20px

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const speedEl = document.getElementById('speed');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');

let snake, dir, nextDir, food, score, best, timer, speedLevel;
let state = 'ready'; // ready | running | paused | over

best = Number(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function init() {
  const mid = Math.floor(GRID / 2);
  snake = [{x: mid, y: mid}, {x: mid - 1, y: mid}, {x: mid - 2, y: mid}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speedLevel = 1;
  scoreEl.textContent = 0;
  speedEl.textContent = 1;
  placeFood();
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  init();
  state = 'running';
  overlay.classList.add('hidden');
  schedule();
}

function schedule() {
  clearTimeout(timer);
  const interval = Math.max(60, 160 - (speedLevel - 1) * 12);
  timer = setTimeout(tick, interval);
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙
  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
  // 撞自己（尾巴即将移走时允许进入尾格）
  if (snake.slice(0, -1).some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    // 每吃 4 个食物加速
    const newLevel = Math.floor(score / 40) + 1;
    if (newLevel !== speedLevel) {
      speedLevel = newLevel;
      speedEl.textContent = speedLevel;
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
  schedule();
}

function gameOver() {
  state = 'over';
  clearTimeout(timer);
  overlayTitle.textContent = '游戏结束';
  overlayText.innerHTML = `本局得分：<b style="color:#4ade80">${score}</b>${score >= best && score > 0 ? ' 🎉 新纪录！' : ''}`;
  startBtn.textContent = '再来一局';
  overlay.classList.remove('hidden');
}

function draw() {
  // 背景
  ctx.fillStyle = '#0f1b2b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
    ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // 食物（发光圆点）
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  ctx.shadowColor = '#f87171';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(fx, fy, CELL * 0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 蛇身（头亮尾暗渐变）
  snake.forEach((s, i) => {
    const t = i / snake.length;
    const pad = i === 0 ? 1.5 : 2.5;
    ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74, 222, 128, ${0.9 - t * 0.55})`;
    if (i === 0) { ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 10; }
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    ctx.shadowBlur = 0;
  });

  // 蛇眼
  const h = snake[0];
  ctx.fillStyle = '#0d1420';
  const ex = h.x * CELL + CELL / 2 + dir.x * 4;
  const ey = h.y * CELL + CELL / 2 + dir.y * 4;
  const ox = dir.y !== 0 ? 4 : 0, oy = dir.x !== 0 ? 4 : 0;
  ctx.beginPath();
  ctx.arc(ex - ox, ey - oy, 2, 0, Math.PI * 2);
  ctx.arc(ex + ox, ey + oy, 2, 0, Math.PI * 2);
  ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

function setDir(x, y) {
  // 禁止 180° 掉头
  if (state === 'running' && !(x === -dir.x && y === -dir.y)) {
    nextDir = {x, y};
  }
}

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();
  switch (key) {
    case 'arrowup': case 'w': setDir(0, -1); break;
    case 'arrowdown': case 's': setDir(0, 1); break;
    case 'arrowleft': case 'a': setDir(-1, 0); break;
    case 'arrowright': case 'd': setDir(1, 0); break;
    case ' ':
      if (state === 'running') {
        state = 'paused';
        clearTimeout(timer);
        overlayTitle.textContent = '已暂停';
        overlayText.textContent = '按空格或点击按钮继续';
        startBtn.textContent = '继续';
        overlay.classList.remove('hidden');
      } else if (state === 'paused') {
        state = 'running';
        overlay.classList.add('hidden');
        schedule();
      }
      break;
    case 'enter':
      if (state !== 'running') start();
      break;
  }
});

// 触屏滑动支持
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
    if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
    else setDir(0, Math.sign(dy));
  }
  touchStart = null;
});

startBtn.addEventListener('click', () => {
  if (state === 'paused') {
    state = 'running';
    overlay.classList.add('hidden');
    schedule();
  } else {
    start();
  }
});

init();
</script>
</body>
</html>
